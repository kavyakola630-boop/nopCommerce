name: mydotnet project

on:
  push:
    branches:
      - develop

jobs:
  dotnet_publish:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v5

      # 2️⃣ Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # 3️⃣ Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 4️⃣ Build Docker image
      - name: Build Docker image
        run: |
          docker build -t dotnetapp:1.0 .

      # 5️⃣ Trivy Image Scan (vulnerability scan)
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dotnetapp:1.0
          format: 'table'
          exit-code: '0' # set to 1 to fail build on high/critical vulns
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      # 6️⃣ Tag and Push Docker image to ECR
      - name: Tag and Push Docker image
        run: |
          docker tag dotnetapp:1.0 256935247024.dkr.ecr.ap-south-1.amazonaws.com/kavya:latest
          docker push 256935247024.dkr.ecr.ap-south-1.amazonaws.com/kavya:latest

      # 7️⃣ Trivy Kubernetes Manifest Scan (misconfigurations)
      - name: Trivy Kubernetes Manifest Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          format: 'table'
          exit-code: '0' # change to 1 if you want to fail on misconfigs
          severity: 'HIGH,CRITICAL'
          scanners: 'misconfig'
          scan-ref: '.'

      # 8️⃣ Configure kubectl for EKS
      - name: Configure kubectl for EKS
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

      # 9️⃣ Deploy manifests to EKS
      - name: Deploy to EKS
        run: |
          kubectl apply -f dotnet1.yaml
          kubectl get pods -o wide
